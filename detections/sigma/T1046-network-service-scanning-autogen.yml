title: Network Service Scanning from Known Mass Scanner IPs
id: 3f9a6b93-3242-4661-b8bc-e6871b802615
status: experimental
description: Detects inbound network connection attempts from known mass scanning IP addresses indicative of Network Service Scanning (T1046). The source IP 77.83.240.70 (ASN 49870, Alsycon B.V.) was observed hitting multiple honeypot types with over 1 million events in 24 hours, suggesting automated mass scanning behaviour.
author: Jahsean Meikle
date: 2026/05/27
references:
    - https://attack.mitre.org/techniques/T1046/
tags:
    - attack.discovery
    - attack.t1046
logsource:
    category: network_connection
    product: windows
detection:
    selection_source_ip:
        # Maintainable scanner list: add one CIDR per line (use /32 for a single host).
        source.ip|cidr:
            - '77.83.240.70/32'
    filter_legitimate_services:
        destination.port:
            - 80
            - 443
    condition: selection_source_ip and not filter_legitimate_services
fields:
    - source.ip
    - destination.ip
    - destination.port
    - process.name
    - process.executable
    - process.command_line
falsepositives:
    - Legitimate security scanners or vulnerability assessment tools from shared infrastructure
    - CDN or proxy services sharing IP address space
    - Penetration testing engagements from third-party vendors
level: high