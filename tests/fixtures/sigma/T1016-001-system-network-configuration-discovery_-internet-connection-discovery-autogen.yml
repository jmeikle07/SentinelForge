title: Internet Connection Discovery via Network Enumeration Tools Under cmd.exe
id: f7f59eb3-ad8b-4d57-b1cc-fe60a5418b39
status: experimental
description: |
  Detects cmd.exe spawning common network enumeration tools (ipconfig, netsh, arp, nbtstat, net) consistent with T1016.001 Internet Connection Discovery.

  Defender notes:
  - Hardening control: Log command lines for cmd.exe children and restrict network utilities that standard users do not need.
  - IR step: Determine what launched cmd.exe, review commands run in the same session, and check outbound connections afterwards.
  - Risk treatment: Accept with monitoring: connectivity checks are frequently benign; escalate only with other attacker behaviour.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1016/001/
tags:
- attack.discovery
- attack.t1016.001
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d4
- cert.isc2cc.d5
- nist.800-53.au-12
- nist.800-53.si-4
- cis.v8.8.5
- cis.v8.8.8
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.parent.name: cmd.exe
    process.name:
    - ipconfig.exe
    - netsh.exe
    - arp.exe
    - nbtstat.exe
    - net.exe
    - net1.exe
  condition: selection
falsepositives:
- Legitimate network diagnostic scripts or administrator troubleshooting tools
- Monitoring or asset management software that runs sequential network queries
- Helpdesk or IT automation scripts performing routine network checks
level: medium
fields:
- process.name
- process.command_line
- process.parent.name
- process.parent.executable
- process.executable
