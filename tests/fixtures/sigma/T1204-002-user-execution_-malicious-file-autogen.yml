title: PowerShell IEX Remote Download Targeting Office Macro Execution via raw.githubusercontent.com
id: 27b56c7b-ad80-4099-8416-bdb353facd67
status: experimental
description: |
  Detects PowerShell processes using IEX to download and execute scripts from raw.githubusercontent.com that reference Office product names or macro execution functions, consistent with Atomic Red Team T1204.002 test execution involving Invoke-MalDoc targeting Word documents.

  Defender notes:
  - Hardening control: Block macros from internet-sourced Office files, filter risky attachment types, and run phishing awareness training.
  - IR step: Isolate the host, retrieve the document and macro, identify the delivery email, and purge it from other mailboxes.
  - Risk treatment: Mitigate: macro blocking and training; transfer part of the risk with email security services.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1204/002/
- https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1204.002/T1204.002.yaml
tags:
- attack.execution
- attack.t1204.002
- cert.secplus.2.2
- cert.secplus.2.4
- cert.secplus.4.5
- cert.secplus.5.6
- cert.isc2cc.d2
- cert.isc2cc.d5
- nist.800-53.at-2
- nist.800-53.si-3
- nist.800-53.si-4
- cis.v8.8.8
- cis.v8.9.6
- cis.v8.10.1
- cis.v8.14.2
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    process.name: powershell.exe
  selection_iex_iwr:
    process.command_line|contains|all:
    - IEX
    - iwr
    - raw.githubusercontent.com
  selection_maldoc_indicators:
    process.command_line|contains:
    - Invoke-MalDoc
    - Invoke-Maldoc
    - T1204.002
  selection_office_macro:
    process.command_line|contains:
    - officeProduct
    - macroFile
    - Word
    - Excel
    - macrocode
  condition: selection_process and selection_iex_iwr and (selection_maldoc_indicators or selection_office_macro)
falsepositives:
- Security researchers or red team operators legitimately running Atomic Red Team tests in authorized environments
- Internal automation scripts that use IEX with raw.githubusercontent.com for benign tooling deployment
fields:
- process.name
- process.command_line
- process.parent.name
- winlog.event_data.IntegrityLevel
- dns.question.name
level: high
