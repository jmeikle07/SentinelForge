logsource:
  category: dns_query
  product: windows
detection:
  selection:
    process.name:
    - powershell.exe
    - pwsh.exe
    dns.question.name: raw.githubusercontent.com
  condition: selection
falsepositives:
- Administrators, package managers and installers that legitimately download scripts from GitHub with PowerShell
- Developer workstations running build or bootstrap scripts
level: low
fields:
- process.name
- process.executable
- dns.question.name
- event.code
