title: HideFileExt Registry Modification via reg.exe
id: 0acbfe83-9428-4eda-8c9c-6482e4d60c0a
status: experimental
related:
- id: 57053051-8d37-43fc-b572-c3c2c320da81
  type: similar
description: |
  Detects reg.exe setting HideFileExt to 1 under the Explorer Advanced registry key, which hides file extensions in Windows Explorer. This technique is used by attackers to disguise malicious executables as benign files to support phishing and execution stages.

  Defender notes:
  - Hardening control: Enforce secure configuration baselines through Group Policy and restrict reg.exe for standard users.
  - IR step: Record the key and value changed, revert it to baseline, and determine what process and user made the change.
  - Risk treatment: Mitigate: configuration management; accept low-impact cosmetic changes with monitoring.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1112/
tags:
- attack.defense_evasion
- attack.t1112
- cert.secplus.2.4
- cert.secplus.4.1
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.au-12
- nist.800-53.au-6
- nist.800-53.cm-5
- nist.800-53.cm-6
- cis.v8.4.1
- cis.v8.4.7
- cis.v8.8.5
- cis.v8.8.11
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    process.name: reg.exe
    process.parent.name|contains:
    - cmd.exe
    - powershell.exe
  selection_cmdline:
    process.command_line|contains|all:
    - HideFileExt
    - /d 1
    - Explorer\\Advanced
  condition: selection_process and selection_cmdline
falsepositives:
- Legitimate administrative scripts or Group Policy configurations that manage file extension visibility settings for end users
- IT automation tools deploying standardized Windows Explorer settings across managed endpoints
level: medium
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
- winlog.event_data.IntegrityLevel
