logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    event.code: '1'
    process.name: cmdkey.exe
  selection_termsrv:
    process.command_line|contains:
    - /generic:TERMSRV
    - /add:TERMSRV
  selection_pass:
    process.command_line|contains: '/pass:'
  condition: selection_process and (selection_termsrv or selection_pass)
falsepositives:
- Legitimate administrative scripts that automate RDP connections using cmdkey for service accounts in managed environments
- IT automation tools or deployment pipelines that programmatically store RDP credentials
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
- winlog.event_data.IntegrityLevel
level: medium
