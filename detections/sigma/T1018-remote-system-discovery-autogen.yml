title: Remote System Discovery via net.exe view
id: e82c8c54-344a-4bf5-92dd-ad324a5e1f98
status: experimental
related:
- id: 61399e8c-6e6d-46d7-8257-ada4b2f3ea76
  type: similar
description: |
  Detects net.exe whose command line contains "view" (net view, optionally with /domain or a host name) started by cmd.exe or powershell.exe, excluding System integrity level. net view lists the domains, the computers visible on the network and their shares, i.e. Remote System Discovery (T1018). The /domain flag is not required: an earlier selection for it was defined but never used in the condition, so the rule has always matched any net view; the title and description no longer claim otherwise. The narrower "net view /domain" rule 61399e8c-6e6d-46d7-8257-ada4b2f3ea76 (tagged T1482 Domain Trust Discovery, which net view does not perform) is deprecated as a subset of this one.

  Defender notes:
  - Hardening control: Segment workstations from server networks and log net.exe usage with command lines.
  - IR step: Identify the account and host, review which systems were enumerated, and look for follow-on lateral movement.
  - Risk treatment: Mitigate: segmentation limits what enumeration reveals; accept the residual discovery noise.
author: Jahsean Meikle
date: 2026/05/10
modified: 2026/10/05
references:
- https://attack.mitre.org/techniques/T1018/
tags:
- attack.discovery
- attack.t1018
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d4
- cert.isc2cc.d5
- nist.800-53.ca-7
- nist.800-53.si-4
- cis.v8.8.5
- cis.v8.13.1
logsource:
  category: process_creation
  product: windows
detection:
  selection_net_view:
    event.code: '1'
    process.name: net.exe
    process.command_line|contains:
    - view
  selection_parent:
    process.parent.name:
    - cmd.exe
    - powershell.exe
  filter_system_accounts:
    winlog.event_data.IntegrityLevel:
    - System
  condition: selection_net_view and selection_parent and not filter_system_accounts
falsepositives:
- Legitimate IT administrators or helpdesk staff running net view commands for troubleshooting network connectivity or share enumeration
- Automated inventory or asset management scripts executed under user context
- Network monitoring tools that enumerate domain resources on behalf of users
level: medium
