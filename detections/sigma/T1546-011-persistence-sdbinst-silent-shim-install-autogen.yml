logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.name: sdbinst.exe
    process.command_line|contains|all:
    - ' -m'
    - ' -bg'
  condition: selection
falsepositives:
- Windows servicing, patch management or software deployment tools (SCCM, Intune) may run sdbinst.exe silently when installing application compatibility fixes; validate against change windows and the .sdb path.
level: medium
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
