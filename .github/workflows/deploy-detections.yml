name: Validate and Deploy Detection Rules

# Why self-hosted: validation backtests each rule against Elasticsearch and
# deployment talks to Kibana, both of which live on the private lab network
# and are not reachable from GitHub-hosted runners. For that reason this
# workflow is push-to-main only. It must never be triggered by pull requests
# (self-hosted runners would execute untrusted fork code with access to the lab
# network and secrets). PR checks run on GitHub-hosted runners in test.yml.
on:
  push:
    branches:
      - main
    paths:
      - 'detections/sigma/**'

# Least privilege: nothing by default, each job requests what it needs.
permissions: {}

concurrency:
  group: deploy-detections
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: write  # needed only to push self-healed rules back
    outputs:
      head_sha: ${{ steps.heal.outputs.head_sha }}
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find changed Sigma rules
        id: changed-files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # A new branch / unknown base shows up as all zeros or a missing
          # commit; fall back to the first parent of the pushed commit.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BEFORE_SHA=$(git rev-parse "$AFTER_SHA~1" 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          CHANGED=$(git -c core.quotepath=off diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$AFTER_SHA" -- 'detections/sigma/*.yml')
          {
            echo "files<<CHANGED_EOF"
            echo "$CHANGED"
            echo "CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and self-heal each changed rule
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          ELASTIC_URL: ${{ secrets.ELASTIC_URL }}
          KIBANA_URL: ${{ secrets.KIBANA_URL }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SF_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          FAILED=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            echo "=========================================="
            echo "Validating: $file"
            echo "=========================================="
            if ! python validate_rule.py "$file"; then
              echo "CIRCUIT BREAKER: $file could not be validated or healed"
              FAILED=1
            fi
          done <<< "$CHANGED_FILES"
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more rules failed validation; deploy will not run"
            exit 1
          fi

      - name: Commit any self-healed rules back to repo
        id: heal
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if ! git diff --quiet -- detections/sigma/; then
            git add -- detections/sigma/
            git commit -m "auto-heal: self-healed sigma rules [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Healed rules committed back to repo"
          else
            echo "No rules were modified by self-healer"
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    # Runs only when validate succeeded (default success() semantics).
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.any_changed == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout repository (including any healed rules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find changed Sigma rules
        id: changed-files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BEFORE_SHA=$(git rev-parse "$AFTER_SHA~1" 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          CHANGED=$(git -c core.quotepath=off diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$AFTER_SHA" -- 'detections/sigma/*.yml')
          {
            echo "files<<CHANGED_EOF"
            echo "$CHANGED"
            echo "CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy rules to Kibana
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          ELASTIC_URL: ${{ secrets.ELASTIC_URL }}
          KIBANA_URL: ${{ secrets.KIBANA_URL }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        run: |
          FAILED=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            echo "Deploying: $file"
            if ! python deploy_rule.py "$file"; then
              FAILED=1
            fi
          done <<< "$CHANGED_FILES"
          exit "$FAILED"
