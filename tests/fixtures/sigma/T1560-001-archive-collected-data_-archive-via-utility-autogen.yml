title: Archive Utility Spawned by CMD or PowerShell for Data Staging
id: e1bed71c-47d5-4f71-b9f0-a1b6717c06e2
status: experimental
description: |
  Detects cmd.exe or powershell.exe spawning known archive utilities such as Rar.exe or 7z.exe with archive creation flags targeting user profile directories or broad wildcard file patterns, indicative of data staging prior to exfiltration (T1560.001).

  Defender notes:
  - Hardening control: Restrict archive utilities on sensitive systems, apply DLP, and monitor staging directories.
  - IR step: Locate and preserve the archive, identify what data it contains, and check for exfiltration from the same host.
  - Risk treatment: Mitigate: DLP; accept noise from legitimate compression, escalating when paired with outbound transfer.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1560/001/
tags:
- attack.collection
- attack.t1560.001
- cert.secplus.3.3
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.ac-4
- nist.800-53.sc-7
- nist.800-53.si-4
- cis.v8.3.3
- cis.v8.3.13
- cis.v8.8.8
- cis.v8.13.4
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    process.parent.name|contains:
    - cmd.exe
    - powershell.exe
  selection_process:
    process.name|contains:
    - Rar.exe
    - 7z.exe
    - zip.exe
    - WinRAR.exe
  selection_cmdline:
    process.command_line|contains|all:
    - ' a '
    - -r
    process.command_line|contains:
    - '%USERPROFILE%'
    - \Users\
  condition: selection_parent and selection_process and selection_cmdline
falsepositives:
- Legitimate backup scripts or administrative tools that use archive utilities to compress files from user profile directories
- Scheduled tasks or deployment pipelines that invoke archive utilities with recursive flags
level: high
