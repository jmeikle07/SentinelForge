description: |
  Detects any process writing a registry value under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB or AppCompatFlags\Custom, the keys where an application compatibility (shim) database is registered, including registrations made by sdbinst.exe (T1546.011, Event Triggered Execution: Application Shimming). This is the registry half of the former combined rule 5c8ea8be-7a0e-4809-b65a-2d26f91ee077, split out because a registry event can never satisfy a process-creation condition. It deliberately does not exclude sdbinst.exe, since sdbinst is how shims are normally registered; 575160f3-5822-495e-afce-54fee80dca9a is the narrower variant for writers other than sdbinst. Which of these keys a given installer writes was taken from public shim-persistence write-ups and could not be re-verified offline.

  Defender notes:
  - Hardening control: Disable application compatibility shim installation for standard users and audit AppCompatFlags registry changes.
  - IR step: Export the shim database and registry keys, remove the registration, and check the shimmed application for tampering.
  - Risk treatment: Mitigate: configuration control; accept residual risk for legitimate compatibility fixes with change approval.
