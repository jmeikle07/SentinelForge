title: Silent MSI Execution via CMD or PowerShell Proxy
id: b8ee8991-c2af-4d5e-9dd8-4702f01a2e14
status: experimental
related:
- id: c1ced7af-9d77-402a-aebd-b93426ebec3a
  type: similar
description: |
  Detects cmd.exe or powershell.exe spawning msiexec.exe with silent installation flags targeting suspicious paths, consistent with T1218.007 proxy execution abuse via system scripting.

  Defender notes:
  - Hardening control: Use application control to restrict signed proxy-execution binaries and scripts to approved uses.
  - IR step: Identify the proxied payload, preserve the MSI or script, and scope its install or execution footprint.
  - Risk treatment: Mitigate: application control; accept residual risk for legitimate software deployment tools.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1216/
- https://attack.mitre.org/techniques/T1218/007/
tags:
- attack.defense_evasion
- attack.t1216
- attack.t1218.007
- cert.secplus.2.4
- cert.secplus.4.1
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.au-6
- nist.800-53.cm-10
- nist.800-53.cm-11
- nist.800-53.cm-7
- nist.800-53.si-4
- cis.v8.2.3
- cis.v8.2.5
- cis.v8.2.7
- cis.v8.8.8
- cis.v8.8.11
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.parent.name|contains:
    - cmd.exe
    - powershell.exe
    process.name: msiexec.exe
    process.command_line|contains:
    - /q
  selection_path:
    process.command_line|contains:
    - \Users\Public\
    - \AppData\Local\Temp\
    - \ProgramData\
    - \Windows\Temp\
  condition: selection and selection_path
falsepositives:
- Legitimate software deployment tools such as SCCM or PDQ Deploy that invoke msiexec via cmd.exe with silent flags for enterprise application installations
- Administrative scripts performing silent MSI installs from sanctioned directories via cmd.exe during patch management cycles
level: high
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
