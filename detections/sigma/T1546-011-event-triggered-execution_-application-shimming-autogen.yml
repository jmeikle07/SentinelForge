logsource:
  product: windows
  category: registry_set
detection:
  selection:
    registry.key|contains:
    - \AppCompatFlags\InstalledSDB\
    - \AppCompatFlags\Custom\
    - \AppCompatFlags\SdbUpdates\
  filter_sdbinst:
    process.executable|endswith:
    - \Windows\System32\sdbinst.exe
    - \Windows\SysWOW64\sdbinst.exe
  condition: selection and not filter_sdbinst
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- registry.key
- registry.value
falsepositives:
- Windows Update / servicing components and msiexec (an MSI that ships a shim registers it through the Windows apphelp API, not the sdbinst binary) may write these keys
- Enterprise application compatibility toolkits used by IT administrators to deploy shims for legacy software
- Group Policy-based shim deployments managed by domain administrators for application compatibility purposes
level: medium
