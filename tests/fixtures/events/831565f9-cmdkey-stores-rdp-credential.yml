id: 831565f9-d936-4dcc-abaf-0112e0cb5bb4
positive:
- name: cmdkey stores a generic TERMSRV credential with a plaintext password
  event: &ev
    event.code: "1"
    process.name: cmdkey.exe
    process.executable: C:\Windows\System32\cmdkey.exe
    process.command_line: cmdkey /generic:TERMSRV/10.0.0.5 /user:CORP\admin /pass:Winter2026!
    process.parent.name: cmd.exe
- name: cmdkey /add with a password for a non-RDP target
  event:
    <<: *ev
    process.command_line: cmdkey /add:fileserver01 /user:CORP\svc /pass:Secret1
- name: TERMSRV credential without /pass (cmdkey prompts for it)
  event:
    <<: *ev
    process.command_line: cmdkey /add:TERMSRV/10.0.0.5 /user:CORP\admin
negative:
- name: cmdkey /list only reads stored target names (not what this rule detects)
  event:
    <<: *ev
    process.command_line: cmdkey /list
- name: cmdkey /delete
  event:
    <<: *ev
    process.command_line: cmdkey /delete:TERMSRV/10.0.0.5
- name: different binary with the same arguments
  event:
    <<: *ev
    process.name: notcmdkey.exe
recased_positive:
- name: "CMDKEY /ADD:TERMSRV in capitals"
  event:
    <<: *ev
    process.name: "CMDKEY.EXE"
    process.command_line: "CMDKEY /GENERIC:TERMSRV/10.0.0.5 /USER:CORP\\ADMIN /PASS:Winter2026!"
