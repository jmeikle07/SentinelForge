description: |
  Deprecated: superseded by 5c8ea8be-7a0e-4809-b65a-2d26f91ee077 (sdbinst -m -bg) and the registry_set rules 132c70fd-1074-4d10-a9f5-cd1be4e40ef6 / 575160f3-5822-495e-afce-54fee80dca9a. Detects sdbinst.exe started with -m and -bg whose parent is not TrustedInstaller.exe or msiexec.exe, an application shimming persistence pattern (T1546.011). This rule was originally filed under T1547.001 (Run keys / Startup folder), which it does not detect, and it ANDed a registry event with process fields that registry events do not have, so it could never fire. It is now a valid process-creation rule kept only because its id may be deployed.

  Defender notes:
  - Hardening control: Disable application compatibility shim installation for standard users and audit AppCompatFlags registry changes.
  - IR step: Export the shim database and registry keys, remove the registration, and check the shimmed application for tampering.
  - Risk treatment: Mitigate: configuration control; accept residual risk for legitimate compatibility fixes with change approval.
