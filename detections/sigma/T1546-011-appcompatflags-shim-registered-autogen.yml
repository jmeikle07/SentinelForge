  product: windows
detection:
  selection:
    registry.key|contains:
    - \AppCompatFlags\InstalledSDB\
    - \AppCompatFlags\Custom\
  condition: selection
falsepositives:
- Enterprise application compatibility deployments (SCCM, Group Policy, the Application Compatibility Toolkit) and software installers that ship shims
- Windows servicing registering built-in compatibility databases
level: medium
