title: Domain Trust Discovery via Net View Command Chaining
id: 61399e8c-6e6d-46d7-8257-ada4b2f3ea76
status: experimental
description: |
  Detects cmd.exe or powershell.exe spawning net.exe with arguments containing 'view' and '/domain' consistent with domain trust discovery activity (T1482). Observed pattern includes chained commands 'net view /domain & net view' executed under user context.

  Defender notes:
  - Hardening control: Restrict directory trust enumeration to administrative accounts and log net.exe command chains.
  - IR step: Identify the account and host, review the trusts enumerated, and watch for cross-domain lateral movement.
  - Risk treatment: Accept with monitoring: trust discovery is rare for standard users and valuable as a high-signal indicator.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1482/
tags:
- attack.discovery
- attack.t1482
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d4
- cert.isc2cc.d5
- nist.800-53.ca-7
- nist.800-53.si-4
- cis.v8.8.5
- cis.v8.13.1
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    process.parent.name|contains:
    - cmd.exe
    - powershell.exe
  selection_process:
    process.name: net.exe
  selection_cmdline:
    process.command_line|contains|all:
    - view
    - /domain
  condition: selection_parent and selection_process and selection_cmdline
falsepositives:
- Legitimate IT administrative scripts enumerating domain resources using net view
- Automated inventory or asset management tools querying domain shares
level: medium
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
- winlog.event_data.IntegrityLevel
