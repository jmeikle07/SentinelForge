title: Process Discovery via Scripting Interpreter - whoami and hostname Execution
id: 446e7f75-e0c5-48f7-a701-807d8b0a481c
status: experimental
description: |
  Detects whoami.exe or HOSTNAME.EXE spawned by scripting interpreters such as powershell.exe or cmd.exe, indicating potential post-exploitation process discovery consistent with ATT&CK T1057.

  Defender notes:
  - Hardening control: Collect command-line audit logs and restrict scripting engines for users who do not need them.
  - IR step: Check the scripting engine's parent and the rest of its session for credential or lateral movement activity.
  - Risk treatment: Accept: process discovery is low-impact; escalate only with other attacker behaviour.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1057/
tags:
- attack.discovery
- attack.t1057
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.au-12
- nist.800-53.si-4
- cis.v8.8.5
- cis.v8.8.8
logsource:
  category: process_creation
  product: windows
detection:
  selection_child:
    event.code: '1'
    process.name|contains:
    - whoami.exe
    - HOSTNAME.EXE
  selection_parent:
    process.parent.name|contains:
    - powershell.exe
    - cmd.exe
    - wscript.exe
  filter_legitimate:
    process.parent.name|contains:
    - explorer.exe
  condition: selection_child and selection_parent and not filter_legitimate
falsepositives:
- Legitimate administrative scripts that invoke whoami or hostname for diagnostic or inventory purposes
- Automated deployment or configuration management tools running under scripting interpreters
level: medium
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
- winlog.event_data.IntegrityLevel
