logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    process.name: sdbinst.exe
    process.command_line|contains|all:
    - ' -m'
    - ' -bg'
  filter_legitimate_parent:
    process.parent.name:
    - TrustedInstaller.exe
    - MsiExec.exe
    - msiexec.exe
  condition: selection_process and not filter_legitimate_parent
falsepositives:
- Windows servicing, patch management or software deployment tools that run sdbinst.exe silently from another parent process
level: medium
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
