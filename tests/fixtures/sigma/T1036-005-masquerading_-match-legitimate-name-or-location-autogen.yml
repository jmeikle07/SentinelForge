title: Masquerading System Utilities via Path Mismatch or Suspicious Parent
id: 73cfc61f-1ee0-4dcc-ad78-edb3fda1ed6c
status: experimental
description: |
  Detects system utility binaries (whoami.exe, hostname.exe, svchost.exe, etc.) executing from paths outside their expected system directories, indicating potential masquerading consistent with T1036.005.

  Defender notes:
  - Hardening control: Enforce application allowlisting so system utilities only run from their expected paths, and alert on path mismatches.
  - IR step: Hash and preserve the masquerading binary, compare it to the legitimate file, and hunt for the same hash across hosts.
  - Risk treatment: Mitigate: allowlisting; accept residual risk where admins run copies of tools from non-standard paths.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1036/005/
tags:
- attack.defense_evasion
- attack.t1036.005
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.au-6
- nist.800-53.cm-7
- nist.800-53.si-4
- nist.800-53.si-7
- cis.v8.2.5
- cis.v8.8.8
- cis.v8.8.11
- cis.v8.10.7
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.name|endswith:
    - whoami.exe
    - hostname.exe
    - svchost.exe
    - taskhostw.exe
    - smartscreen.exe
  filter:
    process.executable|startswith:
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
    - C:\Windows\WinSxS\
  condition: selection and not filter
falsepositives:
- Penetration testing tools or red team exercises invoking system utilities from non-standard paths
- Developer environments with custom builds of system utilities
level: high
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
