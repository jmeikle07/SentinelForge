id: 77ecdffa-3fa9-462a-a86d-ea87e42455d0
positive:
- name: net use \\host\IPC$ with a listed password from cmd.exe
  event: &ev
    event.code: "1"
    process.name: net.exe
    process.executable: C:\Windows\System32\net.exe
    process.command_line: net use \\10.0.0.5\IPC$ /user:administrator Password1
    process.parent.name: cmd.exe
- name: another listed password
  event:
    <<: *ev
    process.command_line: net use \\10.0.0.5\IPC$ /user:administrator Spring2022
negative:
- name: password not in the list
  event:
    <<: *ev
    process.command_line: net use \\10.0.0.5\IPC$ /user:administrator Xk3-unrelated-pw
- name: not an IPC$ share
  event:
    <<: *ev
    process.command_line: 'net use Z: \\fileserver\data /user:bob Password1'
- name: parent is not cmd.exe
  event:
    <<: *ev
    process.parent.name: powershell.exe
