# SentinelForge ElastAlert config TEMPLATE. Never put secrets here.
# Render with elastalert/run.sh, which substitutes ${...} from the environment
# (see .env.example) into a git-ignored build directory.
es_host: ${ELASTIC_HOST}
es_port: ${ELASTIC_PORT}
use_ssl: true
verify_certs: true
es_api_key: ${ELASTIC_API_KEY}
rules_folder: ${ELASTALERT_RULES_DIR}
run_every:
  minutes: 5
buffer_time:
  minutes: 15
writeback_index: elastalert_status
alert_time_limit:
  days: 2
