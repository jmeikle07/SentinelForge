- cis.v8.14.2
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    process.name: powershell.exe
  selection_iex_iwr:
    process.command_line|contains|all:
    - IEX
    - iwr
    - raw.githubusercontent.com
  selection_maldoc_indicators:
    process.command_line|contains:
    - Invoke-MalDoc
    - Invoke-Maldoc
    - T1204.002
  selection_office_macro:
    process.command_line|contains:
    - officeProduct
    - macroFile
    - Word
    - Excel
    - macrocode
  condition: selection_process and selection_iex_iwr and (selection_maldoc_indicators or selection_office_macro)
falsepositives:
- Security researchers or red team operators legitimately running Atomic Red Team tests in authorized environments
- Internal automation scripts that use IEX with raw.githubusercontent.com for benign tooling deployment
fields:
- process.name
- process.command_line
- process.parent.name
- winlog.event_data.IntegrityLevel
- dns.question.name
level: low
