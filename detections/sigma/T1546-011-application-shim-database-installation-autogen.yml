logsource:
  category: process_creation
  product: windows
detection:
  selection_sdbinst_execution:
    process.name: sdbinst.exe
    process.command_line|contains|all:
    - ' -m'
    - ' -bg'
  condition: selection_sdbinst_execution
falsepositives:
- Enterprise application compatibility shim deployments managed via SCCM or Group Policy
- Windows servicing or vendor installers that call sdbinst.exe silently
fields:
