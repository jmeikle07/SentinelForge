title: Svchost Started by services.exe with a Service Group Not in the Allowlist
id: 6d060b71-5faf-425c-bf21-bb7751cc0e83
status: experimental
description: |
  Detects svchost.exe started by services.exe whose "-k <group>" argument is not an exact member of an allowlist of Windows service host groups, e.g. a service registered by an attacker to run under SYSTEM (T1569.002 Service Execution, formerly T1035). The group must now be the whole token: " -k netsvcs " followed by more arguments, or " -k netsvcs" ending the command line. The earlier version used a prefix substring match, so "-k netsvcsEvil" or "-k LocalServiceEvil" passed as "known". The allowlist is the original list plus every group named in HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Svchost on the lab host (Windows 11 build 26300); groups added by other Windows builds or by third-party software will alert until added. Limitations: a malicious ServiceDll added to an existing group such as netsvcs shows the allowed group name and is not detected; literals are case-sensitive, so "Camera" and "camera" are separate entries. Matches only the Sysmon process-creation event of the service host.

  Defender notes:
  - Hardening control: Disable unnecessary services, restrict service creation to administrators, and baseline svchost service groups.
  - IR step: Inspect the new or modified service binary and parameters, preserve it, and remove persistence once scoped.
  - Risk treatment: Mitigate: service allowlisting and least privilege; accept residual risk from legitimate administrative tooling.
author: Jahsean Meikle
date: 2026/05/15
modified: 2026/10/05
