title: System Network Connections Discovery via Chained CMD Commands
id: 1b7ee4dd-14c6-4538-aa6b-c64169bb6018
status: experimental
description: |
  Detects cmd.exe or powershell.exe spawning netstat.exe (also NETSTAT.EXE, its on-disk name on Windows 11) or net1.exe with -ano or sessions on the command line, enumerating network connections and SMB sessions (T1049). Only the arguments -ano and sessions are matched (a substring test, so any command line containing "sessions" counts); "net use" and other forms are not detected. Chaining several commands in one line is not required.

  Defender notes:
  - Hardening control: Log command lines for chained cmd.exe commands and restrict netstat-style tooling for standard users where practical.
  - IR step: Review the chained commands and parent process, then check for connections to unusual hosts from the same machine.
  - Risk treatment: Accept: connection discovery is common; use as a correlation signal.
author: Jahsean Meikle
date: 2026/05/10
modified: 2026/10/05
references:
- https://attack.mitre.org/techniques/T1049/
tags:
- attack.discovery
- attack.t1049
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d4
- cert.isc2cc.d5
- nist.800-53.au-12
- nist.800-53.si-4
- cis.v8.8.5
- cis.v8.8.8
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    process.parent.name|contains:
    - cmd.exe
    - powershell.exe
  selection_process:
    process.name|contains:
    - netstat
    - NETSTAT
    - net1
  selection_args:
    process.command_line|contains:
    - -ano
    - sessions
  condition: selection_parent and selection_process and selection_args
falsepositives:
- Legitimate administrative scripts that enumerate network connections or mapped drives
- IT monitoring tools that invoke netstat or net commands as part of diagnostics
- Automated deployment or patch management systems running network checks
level: medium
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
