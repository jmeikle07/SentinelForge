description: |
  Deprecated: strict subset of 5c8ea8be-7a0e-4809-b65a-2d26f91ee077. Detects sdbinst.exe started with -m and -bg directly by services.exe (the service control manager, which launches service processes), an application shimming installation pattern (T1546.011) that implies the actor already runs as a service. It was originally tagged T1574.010 (Services File Permissions Weakness), which it does not detect: nothing here inspects service binaries or their ACLs. Its previous description also promised a SYSTEM-context check and SdbUpdates registry creation that the logic never contained; the registry part is covered by 132c70fd-1074-4d10-a9f5-cd1be4e40ef6 / 575160f3-5822-495e-afce-54fee80dca9a and no SYSTEM check is made.

  Defender notes:
  - Hardening control: Disable application compatibility shim installation for standard users and audit AppCompatFlags registry changes.
  - IR step: Export the shim database and registry keys, remove the registration, and check the shimmed application for tampering.
  - Risk treatment: Mitigate: configuration control; accept residual risk for legitimate compatibility fixes with change approval.
