title: Windows Credential Manager Injection via cmdkey.exe for RDP Lateral Movement
id: 831565f9-d936-4dcc-abaf-0112e0cb5bb4
status: experimental
description: |
  Detects cmdkey.exe invoked with plaintext credentials targeting TERMSRV namespace, indicating credential staging for RDP lateral movement via Windows Credential Manager (T1555.004).

  Defender notes:
  - Hardening control: Restrict cmdkey use, enable Credential Guard, and prefer MFA over stored RDP credentials.
  - IR step: Identify the stored credentials and targets, reset affected accounts, and review RDP connections that followed.
  - Risk treatment: Mitigate: Credential Guard and MFA; accept residual risk for legitimate stored administrator sessions.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1555/004/
- https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/cmdkey
tags:
- attack.credential_access
- attack.t1555.004
- attack.lateral_movement
- attack.t1021.001
- cert.secplus.2.2
- cert.secplus.2.4
- cert.secplus.3.2
- cert.secplus.4.6
- cert.isc2cc.d3
- cert.isc2cc.d4
- cert.isc2cc.d5
- nist.800-53.ac-17
- nist.800-53.ac-6
- nist.800-53.ia-2
- nist.800-53.ia-5
- nist.800-53.sc-7
- nist.800-53.si-4
- cis.v8.4.4
- cis.v8.5.2
- cis.v8.5.4
- cis.v8.6.4
- cis.v8.8.8
- cis.v8.13.4
- cis.v8.13.5
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    event.code: '1'
    process.name: cmdkey.exe
  selection_termsrv:
    process.command_line|contains: /generic:TERMSRV
  selection_pass:
    process.command_line|contains: '/pass:'
  condition: selection_process and (selection_termsrv or selection_pass)
falsepositives:
- Legitimate administrative scripts that automate RDP connections using cmdkey for service accounts in managed environments
- IT automation tools or deployment pipelines that programmatically store RDP credentials
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
- winlog.event_data.IntegrityLevel
level: high
