description: |
  Deprecated: duplicate of 5c8ea8be-7a0e-4809-b65a-2d26f91ee077; its registry half now lives in the registry_set rules 132c70fd-1074-4d10-a9f5-cd1be4e40ef6 and 575160f3-5822-495e-afce-54fee80dca9a. Detects sdbinst.exe started with both -m and -bg, i.e. application shim database installation (T1546.011, Event Triggered Execution: Application Shimming). It was originally tagged T1218.011 (Rundll32), which sdbinst is not. Earlier versions matched on either flag alone and carried a filter on registry events that used fields (IntegrityLevel, parent process) which registry events do not have, so the filter never excluded anything.

  Defender notes:
  - Hardening control: Disable application compatibility shim installation for standard users and audit AppCompatFlags registry changes.
  - IR step: Export the shim database and registry keys, remove the registration, and check the shimmed application for tampering.
  - Risk treatment: Mitigate: configuration control; accept residual risk for legitimate compatibility fixes with change approval.
