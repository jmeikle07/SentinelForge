title: cmdkey.exe Stores a Credential for RDP Use (Credential Staging for Lateral Movement)
id: 831565f9-d936-4dcc-abaf-0112e0cb5bb4
status: experimental
related:
- id: 43846fcf-f24e-420e-8469-6a61e6201646
  type: similar
description: |
  Detects cmdkey.exe adding a stored credential to Windows Credential Manager: either a TERMSRV generic/add entry (the target prefix mstsc uses for Remote Desktop credentials) or any command line with /pass: (a plaintext password). Staging a credential so a later mstsc connection signs in without a prompt supports RDP lateral movement (T1021.001). It was tagged T1555.004 Windows Credential Manager, but that technique is about obtaining credentials from the store; cmdkey with /add, /generic or /pass: writes to it, so the tag is removed (cmdkey /list, which reads target names, is not detected). The two selections are ORed: a TERMSRV entry without /pass or a /pass: for any non-RDP target also matches. Flags are matched case-sensitively as written. Level medium because automation and service accounts do the same.

  Defender notes:
  - Hardening control: Restrict cmdkey.exe for users who do not need it, enable Credential Guard, and prefer MFA over stored RDP credentials.
  - IR step: Identify the stored target and account, remove the entry (cmdkey /delete), reset the affected account, and review RDP connections that followed.
  - Risk treatment: Mitigate: Credential Guard and MFA; accept residual risk for legitimate stored administrator sessions.
author: Jahsean Meikle
