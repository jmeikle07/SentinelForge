title: Whoami and Hostname Execution from a Scripting Parent (Superseded, Was Tagged Process Discovery)
id: 446e7f75-e0c5-48f7-a701-807d8b0a481c
status: deprecated
related:
- id: 0d36e12f-4b63-4cf0-8483-8552b1d57090
  type: similar
- id: 1457a8cc-0e8f-4a18-ae3c-1ee41e4bb8c6
  type: similar
description: |
  Deprecated: strict subset of 0d36e12f-4b63-4cf0-8483-8552b1d57090, which has the same child binaries and a longer parent list. Detects whoami.exe or HOSTNAME.EXE started by powershell.exe, cmd.exe or wscript.exe. It was tagged T1057 Process Discovery, but neither binary lists processes, so the tag is corrected to T1033 System Owner/User Discovery. The explorer.exe exclusion never changed the result: a parent name cannot contain both a script interpreter and explorer.exe.

  Defender notes:
  - Hardening control: Collect command-line audit logs and restrict scripting engines to users who need them.
  - IR step: Check what spawned the scripting engine and whether it ran with user or elevated rights, then widen to the host timeline.
  - Risk treatment: Accept: owner discovery is low-impact; the alert is valuable mostly as correlation context.
author: Jahsean Meikle
date: 2026/05/10
modified: 2026/10/05
references:
- https://attack.mitre.org/techniques/T1057/
tags:
- attack.discovery
- attack.t1033
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.au-12
- nist.800-53.si-4
- cis.v8.8.5
- cis.v8.8.8
logsource:
  category: process_creation
  product: windows
detection:
  selection_child:
    event.code: '1'
    process.name|contains:
    - whoami.exe
    - HOSTNAME.EXE
  selection_parent:
    process.parent.name|contains:
    - powershell.exe
    - cmd.exe
    - wscript.exe
  filter_legitimate:
    process.parent.name|contains:
    - explorer.exe
  condition: selection_child and selection_parent and not filter_legitimate
falsepositives:
- Legitimate administrative scripts that invoke whoami or hostname for diagnostic or inventory purposes
- Automated deployment or configuration management tools running under scripting interpreters
level: medium
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
- winlog.event_data.IntegrityLevel
