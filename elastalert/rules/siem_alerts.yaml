name: SIEM Detection Alert
type: any
index: .alerts-security.alerts-default

filter:
  - term:
      kibana.alert.status: "active"

include:
  - "kibana.alert.rule.name"
  - "kibana.alert.severity"
  - "kibana.alert.reason"
  - "kibana.alert.risk_score"
  - host.name
  - "@timestamp"
  - process.name
  - process.command_line
  - process.parent.name
  - user.name

alert:
  - email

email:
  - ${ALERT_EMAIL_TO}

smtp_host: ${SMTP_HOST}
smtp_port: ${SMTP_PORT}
smtp_ssl: true
smtp_auth_file: ${SMTP_AUTH_FILE}
from_addr: ${ALERT_EMAIL_FROM}

alert_subject: "[{0}] {1} - {2}"
alert_subject_args:
  - "kibana.alert.severity"
  - "kibana.alert.rule.name"
  - host.name

alert_text_type: alert_text_only
alert_text: |
  ======================================
  DETECTION ALERT  |  SentinelForge
  ======================================

  Rule:       {0}
  Severity:   {1}
  Host:       {2}
  Time:       {3}

  --------------------------------------
  WHAT HAPPENED
  --------------------------------------
  {4}

  --------------------------------------
  PROCESS
  --------------------------------------
  Name:       {5}
  Command:    {6}
  Parent:     {7}
  User:       {8}

  --------------------------------------
  Dashboard: ${ALERT_DASHBOARD_URL}

alert_text_args:
  - "kibana.alert.rule.name"
  - "kibana.alert.severity"
  - host.name
  - "@timestamp"
  - "kibana.alert.reason"
  - process.name
  - process.command_line
  - process.parent.name
  - user.name

realert:
  minutes: 60

timestamp_field: "@timestamp"
