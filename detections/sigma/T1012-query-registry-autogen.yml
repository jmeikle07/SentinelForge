title: Registry Query of the HotPatch Key by a Non-SYSTEM User (Lab Simulation Signature)
id: 40c64994-869e-4907-967b-6ff05bd0f8d8
status: experimental
description: |
  Lab-validated simulation signature for a T1012 Query Registry test: reg.exe with "query" and "HotPatch" on the command line (HKLM\SYSTEM\CurrentControlSet\Control\HotPatch) at an integrity level other than System. Only this one key is matched, so ordinary registry reconnaissance of other keys is not detected; whether the key is part of a published Atomic Red Team test could not be verified offline. This is a lab-validated simulation signature: it matches the literal strings of one lab simulation and says nothing about other ways of doing the same thing, so it proves the pipeline end to end and is not a general detector.

  Defender notes:
  - Hardening control: Collect process-creation events with full command lines and baseline legitimate registry query tooling per host role.
  - IR step: Review the parent process chain and the same user's session for follow-on discovery or credential access.
  - Risk treatment: Accept: low-impact discovery on its own; monitor and escalate when combined with other discovery or execution alerts.
author: Jahsean Meikle
date: 2026/05/11
modified: 2026/10/05
references:
- https://attack.mitre.org/techniques/T1012/
tags:
- attack.discovery
- attack.t1012
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.au-12
- nist.800-53.si-4
- cis.v8.8.5
- cis.v8.8.8
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    event.code: '1'
    process.name: reg.exe
  selection_commandline:
    process.command_line|contains|all:
    - query
    - HotPatch
  filter_system_user:
    winlog.event_data.IntegrityLevel: System
  condition: selection_process and selection_commandline and not filter_system_user
falsepositives:
- Legitimate administrative scripts querying HotPatch registry settings under a user account
- Security or patch management tooling running under interactive user context
level: low
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
- winlog.event_data.IntegrityLevel
