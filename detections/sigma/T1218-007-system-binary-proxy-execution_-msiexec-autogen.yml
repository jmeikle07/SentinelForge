- cis.v8.2.3
- cis.v8.2.5
- cis.v8.8.8
- cis.v8.8.11
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    event.code: '1'
    process.name|endswith: msiexec.exe
    process.parent.name|endswith:
    - cmd.exe
    - powershell.exe
    - pwsh.exe
  selection_cmdline:
    process.command_line|contains|all:
    - /q
    - /i
  filter_standard_paths:
    process.command_line|contains:
    - C:\Program Files
    - C:\Program Files (x86)
    - C:\Windows\ccmcache
    - C:\Windows\ccmsetup
    - C:\ProgramData\Microsoft\Windows\Start Menu
    - C:\Windows\Installer
  condition: selection_process and selection_cmdline and not filter_standard_paths
falsepositives:
- Legitimate software deployments using custom or non-standard installation directories
- Administrative scripts invoking msiexec silently from non-default paths during provisioning or imaging
- Third-party patch management or RMM tools that stage MSI files outside standard directories
level: medium
