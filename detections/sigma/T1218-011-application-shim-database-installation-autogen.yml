title: Application Shim Database Installation via sdbinst.exe
id: 9d19c38d-a376-4e18-a517-db535a8322be
status: experimental
related:
- id: c27fffce-2372-458e-ae4b-4f247823dc2c
  type: similar
- id: 5c8ea8be-7a0e-4809-b65a-2d26f91ee077
  type: similar
- id: 575160f3-5822-495e-afce-54fee80dca9a
  type: similar
description: |
  Detects the installation of application shim databases via sdbinst.exe with suspicious flags (-m -bg) and associated registry writes to AppCompatFlags SdbUpdates keys, indicative of T1218.011 shim-based defense evasion or persistence.

  Defender notes:
  - Hardening control: Block or restrict rundll32 and sdbinst for standard users with application control and audit their command lines.
  - IR step: Identify the DLL or shim database loaded, preserve it, and remove the registration once scoped.
  - Risk treatment: Mitigate: application control; accept residual risk where legacy applications need compatibility shims.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1218/011/
- https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html
- https://docs.microsoft.com/en-us/windows/win32/devnotes/application-compatibility-database
tags:
- attack.defense_evasion
- attack.t1218.011
- cert.secplus.2.4
- cert.secplus.4.1
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.au-6
- nist.800-53.cm-10
- nist.800-53.cm-7
- nist.800-53.si-4
- cis.v8.2.5
- cis.v8.4.8
- cis.v8.8.8
- cis.v8.8.11
logsource:
  product: windows
  service: sysmon
detection:
  selection_sdbinst_execution:
    event.code: '1'
    process.name: sdbinst.exe
    process.command_line|contains:
    - -m
    - -bg
  selection_registry_sdbupdates:
    event.code: '13'
    registry.key|contains:
    - SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\SdbUpdates
    - SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB
  filter_microsoft_signed_sdb:
    process.name: sdbinst.exe
    registry.key|contains:
    - msimain.sdb
    - sysmain.sdb
    winlog.event_data.IntegrityLevel: System
    process.parent.name:
    - TrustedInstaller.exe
    - TiWorker.exe
    - svchost.exe
  condition: selection_sdbinst_execution or (selection_registry_sdbupdates and not filter_microsoft_signed_sdb)
falsepositives:
- Legitimate enterprise application compatibility shim deployments managed via SCCM or Group Policy
- Microsoft Windows Update installing or updating built-in shim databases (msimain.sdb, sysmain.sdb) via TrustedInstaller
- Software vendors using sdbinst.exe as part of their legitimate installer routines with valid signed shim databases
- IT administrators manually applying application compatibility fixes using the Application Compatibility Toolkit (ACT)
fields:
- process.name
- process.command_line
- process.parent.name
- registry.key
- winlog.event_data.IntegrityLevel
- process.executable
level: high
