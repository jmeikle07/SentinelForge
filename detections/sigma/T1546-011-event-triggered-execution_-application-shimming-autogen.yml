description: |
  Detects registry writes under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB, \Custom or \SdbUpdates by a process that is not the genuine sdbinst.exe (System32 or SysWOW64 path), i.e. a shim registration made directly (reg.exe, PowerShell, custom tooling) and not through sdbinst, an Application Shimming persistence pattern (T1546.011). The sdbinst exclusion is matched on the full image path, so a renamed copy of sdbinst elsewhere is not excluded. The InstalledSDB and Custom keys follow public shim-persistence write-ups; the SdbUpdates key was kept from the original rule and could not be verified offline. See 132c70fd-1074-4d10-a9f5-cd1be4e40ef6 for the variant that also covers sdbinst itself.

  Defender notes:
  - Hardening control: Disable application compatibility shim installation for standard users and audit AppCompatFlags registry changes.
  - IR step: Export the shim database and registry keys, remove the registration, and check the shimmed application for tampering.
  - Risk treatment: Mitigate: configuration control; accept residual risk for legitimate compatibility fixes with change approval.
author: Jahsean Meikle
date: 2026/05/10
modified: 2026/10/05
