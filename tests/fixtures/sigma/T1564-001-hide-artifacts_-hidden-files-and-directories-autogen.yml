title: HideFileExt Registry Value Set via reg.exe
id: 57053051-8d37-43fc-b572-c3c2c320da81
status: experimental
related:
- id: 0acbfe83-9428-4eda-8c9c-6482e4d60c0a
  type: similar
description: |
  Detects reg.exe being used to set HideFileExt to 1 under the current user Explorer Advanced registry key, a technique used to hide file extensions and make malicious files appear benign.

  Defender notes:
  - Hardening control: Enforce Explorer settings (show file extensions) through Group Policy and restrict reg.exe for standard users.
  - IR step: Revert the value, look for files using double extensions, and trace the delivery of those files.
  - Risk treatment: Mitigate: configuration management; the change itself is low-impact, so accept with monitoring.
author: Jahsean Meikle
date: 2026/05/10
references:
- https://attack.mitre.org/techniques/T1564/001/
tags:
- attack.defense_evasion
- attack.t1564.001
- cert.secplus.2.4
- cert.secplus.4.1
- cert.isc2cc.d5
- nist.800-53.au-6
- nist.800-53.cm-5
- nist.800-53.cm-6
- nist.800-53.si-4
- cis.v8.4.1
- cis.v8.4.7
- cis.v8.8.5
- cis.v8.8.11
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    process.name: reg.exe
    process.command_line|contains|all:
    - HideFileExt
    - Explorer\Advanced
    - /d 1
  selection_parent:
    process.parent.name:
    - cmd.exe
    - powershell.exe
  filter_legitimate:
    winlog.event_data.IntegrityLevel: System
  condition: selection_process and selection_parent and not filter_legitimate
falsepositives:
- Legitimate administrative scripts or Group Policy configurations that manage Explorer visual settings
- Software deployment tools that configure user interface preferences
level: high
