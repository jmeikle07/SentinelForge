name: Validate and Deploy Detection Rules

# Why self-hosted: validation backtests each rule against Elasticsearch and
# deployment talks to Kibana, both of which live on the private lab network
# and are not reachable from GitHub-hosted runners. For that reason this
# workflow is push-to-main only. It must never be triggered by pull requests
# (self-hosted runners would execute untrusted fork code with access to the lab
# network and secrets). PR checks run on GitHub-hosted runners in test.yml.
on:
  push:
    branches:
      - main
    paths:
      - 'detections/sigma/**'

# Least privilege: nothing by default, each job requests what it needs.
permissions: {}

# Runs queue instead of cancelling each other (a cancelled run would skip the
# validation of its push). GitHub keeps at most ONE pending run per group, so a
# third rapid push replaces the pending second one; that run is simply dropped.
# Nothing is lost because the diff base is not "this push's before sha" but the
# head of the newest run of this workflow that SUCCEEDED (tools/ci_changes.py, via
# the Actions API; falls back to github.event.before). A dropped run's rules are
# therefore picked up by the next run, and so is a push whose run failed.
concurrency:
  group: deploy-detections
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 90
    # contents: write ONLY because this job pushes the self-heal commit (scripts/ci_push.sh);
    # actions: read lets tools/ci_changes.py look up the last successful run.
    permissions:
      contents: write
      actions: read
    outputs:
      head_sha: ${{ steps.head.outputs.head_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      any_changed: ${{ steps.plan.outputs.any_changed }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      # persist-credentials: false keeps the write token off disk while the (unpinned)
      # pip install runs; the token is handed only to the push step below.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # requirements.txt pins exact versions but not hashes; --require-hashes would need a
      # fully hashed lock file including every transitive dependency (not maintained here).
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find changed, removed and retagged Sigma rules
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/plan"
          mkdir -p "$RUNNER_TEMP/plan"
          python tools/ci_changes.py plan --after "$AFTER_SHA" --event-before "$BEFORE_SHA" \
            --outdir "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"

      - name: Validate and self-heal each changed rule
        if: steps.plan.outputs.any_changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          ELASTIC_URL: ${{ secrets.ELASTIC_URL }}
          KIBANA_URL: ${{ secrets.KIBANA_URL }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SF_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        # Never stops at the first failure: passed.z / failed.z record the outcome and the
        # job is failed in the last step, after the healed rules were published.
        run: bash scripts/ci_validate.sh "$RUNNER_TEMP/plan"

      - name: Tag and commit self-healed rules (rules that passed only)
        id: heal
        if: steps.plan.outputs.any_changed == 'true'
        # The commit message carries [skip ci] and the push uses GITHUB_TOKEN, which does not
        # start workflow runs, so the heal commit cannot retrigger this workflow.
        run: bash scripts/ci_heal.sh "$RUNNER_TEMP/plan"

      - name: Rebase and push healed rules
        if: steps.heal.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Fails the job (and so the run) if the rebase conflicts or a protected main rejects the
        # push: branch protection must allow github-actions[bot] (or use a PAT secret instead).
        run: bash scripts/ci_push.sh main

      - name: Record the commit to deploy
        id: head
        if: steps.plan.outputs.has_work == 'true'
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fail if any rule failed validation
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          if [ -s "$RUNNER_TEMP/plan/failed.z" ]; then
            echo "::error::These rules failed validation (others were healed and published):"
            tr '\0' '\n' < "$RUNNER_TEMP/plan/failed.z"
            echo "Deploy will not run for this push."
            exit 1
          fi

  deploy:
    # Runs only when validate succeeded (default success() semantics): every changed rule passed.
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.has_work == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository (including any healed rules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same plan as the validate job (same base), so exactly the validated set is deployed.
      - name: Find changed, removed and retagged Sigma rules
        id: plan
        env:
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          rm -rf "$RUNNER_TEMP/plan"
          mkdir -p "$RUNNER_TEMP/plan"
          python tools/ci_changes.py plan --after "$AFTER_SHA" --base-sha "$BASE_SHA" \
            --outdir "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"

      # deploy.z marks rules whose ATT&CK technique changed with --allow-retag; removed.z lists
      # rule ids to retire with --delete (a pure rename keeps its id and is never deleted).
      - name: Deploy rules to Kibana
        env:
          ELASTIC_URL: ${{ secrets.ELASTIC_URL }}
          KIBANA_URL: ${{ secrets.KIBANA_URL }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        run: bash scripts/ci_deploy.sh "$RUNNER_TEMP/plan"
