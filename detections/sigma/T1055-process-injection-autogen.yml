title: Atomic Red Team T1055 Invoke-MalDoc Payload Fetch from raw.githubusercontent.com (Lab Simulation Signature)
id: c17705f9-58e7-4834-a3fb-8eba1da3b0b0
status: experimental
description: |
  Lab-validated simulation signature for the Atomic Red Team T1055 test: powershell.exe at High integrity whose command line contains all three literals Invoke-MalDoc, T1055 and raw.githubusercontent.com. Real process injection (T1055) is not detected by this rule; it only recognises that one test's command line, so it is level low and experimental. This is a lab-validated simulation signature: it matches the literal strings of one lab simulation and says nothing about other ways of doing the same thing, so it proves the pipeline end to end and is not a general detector.

  Defender notes:
  - Hardening control: Enable anti-exploitation features and behaviour-based EDR, and constrain PowerShell with Constrained Language Mode and script block logging.
  - IR step: Isolate the host, capture memory of the injected process, and identify the payload source URL for blocking.
  - Risk treatment: Mitigate: EDR and PowerShell constraints; residual risk accepted for unmanaged developer machines with compensating monitoring.
author: Jahsean Meikle
date: 2026/05/10
modified: 2026/10/05
