title: Msiexec Silent Install from Non-Standard Path via CMD or PowerShell
id: c1ced7af-9d77-402a-aebd-b93426ebec3a
status: experimental
related:
- id: b8ee8991-c2af-4d5e-9dd8-4702f01a2e14
  type: similar
description: |
  Detects msiexec.exe started by cmd.exe, powershell.exe or pwsh.exe with silent (/q) install (/i) flags whose command line does not contain a standard software-deployment location (Program Files, ccmcache, ccmsetup, Installer, Start Menu), i.e. a package run from a user-writable or remote path. A signed Windows binary then proxies execution of the MSI payload (T1218.007). The PowerShell parents were merged in from the T1216-tagged duplicate b8ee8991-c2af-4d5e-9dd8-4702f01a2e14, which is now deprecated. The standard-path exclusion is a substring match on the whole command line, so a command line that merely mentions one of those paths elsewhere is also excluded. Level medium: deployment and RMM tooling regularly run msiexec silently from staging folders.

  Defender notes:
  - Hardening control: Restrict msiexec to administrators or software distribution, block installs from user-writable paths, and apply application control.
  - IR step: Retrieve the MSI package, inspect its custom actions, and uninstall and remove artefacts after scoping.
  - Risk treatment: Mitigate: application control; accept residual risk for approved silent deployments.
author: Jahsean Meikle
date: 2026/05/10
modified: 2026/10/05
references:
- https://attack.mitre.org/techniques/T1218/007/
- https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1218.007/T1218.007.md
tags:
- attack.defense_evasion
- attack.t1218.007
- cert.secplus.2.4
- cert.secplus.4.1
