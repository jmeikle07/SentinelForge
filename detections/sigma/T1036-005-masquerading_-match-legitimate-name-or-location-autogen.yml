title: System Utility Name Running from an Unexpected Path (Masquerading)
id: 73cfc61f-1ee0-4dcc-ad78-edb3fda1ed6c
status: experimental
description: |
  Detects a process whose name ends in whoami.exe, hostname.exe, svchost.exe, taskhostw.exe or smartscreen.exe but whose full image path is not that binary in C:\Windows\System32 or C:\Windows\SysWOW64 (or anywhere under C:\Windows\WinSxS, which only administrators and servicing can write), indicating masquerading as a system utility (T1036.005). The earlier rule excluded every path starting with C:\Windows\System32\, so a binary dropped into a user-writable subfolder (for example System32\spool\drivers\color\) was ignored; the allowlist is now the exact binary path. The name test is a suffix match, so lookalikes such as evilsvchost.exe are caught too. The title previously mentioned a suspicious parent, which was never evaluated. Literals are case-sensitive; hostname is listed as HOSTNAME.EXE (its on-disk name on the lab host) and hostname.exe. A non-default Windows directory (not C:\Windows) will alert.

  Defender notes:
  - Hardening control: Enforce application allowlisting so system utilities only run from their expected paths, and alert on path mismatches.
  - IR step: Hash and preserve the masquerading binary, compare it to the legitimate file, and hunt for the same hash across hosts.
  - Risk treatment: Mitigate: allowlisting; accept residual risk where admins run copies of tools from non-standard paths.
author: Jahsean Meikle
date: 2026/05/10
modified: 2026/10/05
references:
- https://attack.mitre.org/techniques/T1036/005/
tags:
- attack.defense_evasion
- attack.t1036.005
- cert.secplus.2.4
- cert.secplus.4.4
- cert.isc2cc.d5
- nist.800-53.au-6
- nist.800-53.cm-7
- nist.800-53.si-4
- nist.800-53.si-7
- cis.v8.2.5
- cis.v8.8.8
- cis.v8.8.11
- cis.v8.10.7
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.name|endswith:
    - whoami.exe
    - hostname.exe
    - HOSTNAME.EXE
    - svchost.exe
    - taskhostw.exe
    - smartscreen.exe
  filter_expected_path:
    process.executable:
    - C:\Windows\System32\whoami.exe
    - C:\Windows\SysWOW64\whoami.exe
    - C:\Windows\System32\svchost.exe
    - C:\Windows\SysWOW64\svchost.exe
    - C:\Windows\System32\taskhostw.exe
    - C:\Windows\SysWOW64\taskhostw.exe
    - C:\Windows\System32\smartscreen.exe
    - C:\Windows\SysWOW64\smartscreen.exe
    - C:\Windows\System32\HOSTNAME.EXE
    - C:\Windows\SysWOW64\HOSTNAME.EXE
    - C:\Windows\System32\hostname.exe
    - C:\Windows\SysWOW64\hostname.exe
  filter_winsxs:
    process.executable|startswith: C:\Windows\WinSxS\
  condition: selection and not (filter_expected_path or filter_winsxs)
falsepositives:
- Penetration testing tools or red team exercises invoking system utilities from non-standard paths
- Developer environments with custom builds of system utilities
level: high
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
