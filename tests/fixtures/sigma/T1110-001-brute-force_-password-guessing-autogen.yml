title: Brute Force Password Guessing via Net Use IPC$ Share with FOR Loop
id: 77ecdffa-3fa9-462a-a86d-ea87e42455d0
status: experimental
description: |
  Detects multiple sequential net use commands targeting IPC$ share with different passwords for the same username, characteristic of T1110.001 password guessing via a cmd.exe FOR loop construct.

  Defender notes:
  - Hardening control: Enforce account lockout, require MFA, ban weak passwords, and restrict net use to administrators.
  - IR step: Identify the targeted accounts and share, reset any account that may have succeeded, and block the source.
  - Risk treatment: Mitigate: lockout and MFA; accept residual risk for legacy systems that cannot enforce MFA, with compensating monitoring.
author: Jahsean Meikle
date: 2026/05/15
references:
- https://attack.mitre.org/techniques/T1110/001/
tags:
- attack.credential_access
- attack.t1110.001
- cert.secplus.2.4
- cert.secplus.4.6
- cert.isc2cc.d3
- cert.isc2cc.d5
- nist.800-53.ac-7
- nist.800-53.ia-5
- nist.800-53.si-4
- cis.v8.5.2
- cis.v8.6.3
- cis.v8.8.11
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    process.parent.name: cmd.exe
    process.name: net.exe
  selection_ipc:
    process.command_line|contains:
    - \\IPC$
  selection_user_flag:
    process.command_line|contains: '/user:'
  selection_passwords:
    process.command_line|contains:
    - Password1
    - 1q2w3e4r
    - Password!
    - Spring2022
    - ChangeMe!
  condition: selection_parent and selection_ipc and selection_user_flag and selection_passwords
falsepositives:
- Legitimate administrative scripts that use net use with IPC$ shares and known password lists in controlled environments
- Automated provisioning tools that iterate credentials for service account setup
level: high
