logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    process.name: sdbinst.exe
    process.command_line|contains|all:
    - ' -m'
    - ' -bg'
  selection_parent:
    process.parent.name: services.exe
  condition: selection_process and selection_parent
falsepositives:
- Windows servicing or application compatibility infrastructure may start sdbinst.exe this way during maintenance; validate against patch windows and the shim database path.
level: medium
fields:
- process.name
- process.executable
- process.command_line
- process.parent.name
- process.parent.executable
