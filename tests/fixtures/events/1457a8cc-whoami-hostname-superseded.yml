id: 1457a8cc-0e8f-4a18-ae3c-1ee41e4bb8c6
positive:
- name: whoami from pwsh.exe
  event: &ev
    event.code: "1"
    process.name: whoami.exe
    process.executable: C:\Windows\System32\whoami.exe
    process.command_line: whoami /groups
    process.parent.name: pwsh.exe
- name: lower-case hostname.exe from mshta.exe
  event:
    <<: *ev
    process.name: hostname.exe
    process.parent.name: mshta.exe
- name: whoami from python.exe
  event:
    <<: *ev
    process.parent.name: python.exe
# Was a negative while the rendered query was case-sensitive (lower-case literal vs the
# on-disk HOSTNAME.EXE). Case-variant expansion in lab.ecs makes Sigma's case-insensitive
# semantics hold, so it is now a positive (intentional change).
- name: upper-case HOSTNAME.EXE (on-disk name) matches through the case variants
  event:
    <<: *ev
    process.name: HOSTNAME.EXE
negative:
- name: net user (actual local account discovery) is not what this selection detects
  event:
    <<: *ev
    process.name: net.exe
    process.command_line: net user
- name: whoami from cmd.exe
  event:
    <<: *ev
    process.parent.name: cmd.exe
