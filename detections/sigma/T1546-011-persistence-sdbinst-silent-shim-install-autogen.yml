description: |
  Detects sdbinst.exe (the Windows application compatibility database installer) started with both the -m and -bg flags, a silent machine-wide shim database installation pattern associated with application shimming persistence (T1546.011). Only the process-creation half is detected here; the AppCompatFlags registry writes that a shim installation produces are covered by the separate registry_set rules 132c70fd-1074-4d10-a9f5-cd1be4e40ef6 and 575160f3-5822-495e-afce-54fee80dca9a (a registry write can never match a process-creation event, so the earlier combined rule could never fire on its registry branch). The -m and -bg switches are not part of sdbinst's publicly documented usage text and their exact meaning could not be verified offline; treat the command line as a pivot, not proof of malice, because Windows servicing and deployment tools may use sdbinst as well.

  Defender notes:
  - Hardening control: Disable application compatibility shim installation for standard users and audit AppCompatFlags registry changes.
  - IR step: Export the shim database and registry keys, remove the registration, and check the shimmed application for tampering.
  - Risk treatment: Mitigate: configuration control; accept residual risk for legitimate compatibility fixes with change approval.
